<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#1E5AA8"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8F4FF"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9500"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C759"/>
      <stop offset="100%" style="stop-color:#28A745"/>
    </linearGradient>
  </defs>
  
  <!-- Background with iOS-style rounded corners -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  
  <!-- House Body -->
  <rect x="280" y="480" width="464" height="344" rx="24" fill="url(#houseGrad)"/>
  
  <!-- Roof -->
  <path d="M512 200 L780 440 L780 480 L244 480 L244 440 Z" fill="url(#roofGrad)"/>
  
  <!-- Chimney -->
  <rect x="640" y="280" width="60" height="140" rx="8" fill="#E85D00"/>
  
  <!-- Door -->
  <rect x="432" y="580" width="160" height="244" rx="16" fill="#1E5AA8"/>
  <circle cx="560" cy="710" r="16" fill="#FFD700"/>
  
  <!-- Windows -->
  <rect x="320" y="540" width="80" height="80" rx="8" fill="#87CEEB"/>
  <rect x="624" y="540" width="80" height="80" rx="8" fill="#87CEEB"/>
  <line x1="360" y1="540" x2="360" y2="620" stroke="#1E5AA8" stroke-width="4"/>
  <line x1="320" y1="580" x2="400" y2="580" stroke="#1E5AA8" stroke-width="4"/>
  <line x1="664" y1="540" x2="664" y2="620" stroke="#1E5AA8" stroke-width="4"/>
  <line x1="624" y1="580" x2="704" y2="580" stroke="#1E5AA8" stroke-width="4"/>
  
  <!-- Checkmark Circle (Maintenance Complete indicator) -->
  <circle cx="760" cy="320" r="100" fill="url(#checkGrad)"/>
  <circle cx="760" cy="320" r="85" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M710 320 L745 355 L810 280" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Wrench accent (Maintenance symbol) -->
  <g transform="translate(264, 680) rotate(-45)">
    <rect x="0" y="0" width="20" height="80" rx="4" fill="#8E8E93"/>
    <circle cx="10" cy="90" r="20" fill="none" stroke="#8E8E93" stroke-width="8"/>
  </g>
</svg>
